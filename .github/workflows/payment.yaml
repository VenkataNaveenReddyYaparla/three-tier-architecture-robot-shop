name: Payment

on:
  push:
    branches:
      - master
    paths:
      - '**.py'  # Only trigger on changes to Python files (**.py)
      - '.github/workflows/payment.yaml'  # Include workflow file changes

  pull_request:
    branches:
      - master
    paths:
      - '**.py'  # Only trigger on changes to Python files (**.py)
      - '.github/workflows/payment.yaml'  # Include workflow file changes

jobs:
  payment:
    name: Build and deploy payment microservice
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment

    steps:
      - name: Checkout code 
        uses: actions/checkout@v7


      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME}}/payment:${{github.run_number}} .  # Build image tagged as 'payment' from current directory

      - name: Docker Login (use secrets)
        run: docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Push
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME}}/payment:${{github.run_number}} 