name: shipping

on:
  push:
    branches:
      - master
    paths:
      - '**.java'  # Only trigger on changes to java files (*.java)
      - '.github/workflows/shipping.yaml'  # Include workflow file changes
      - 'shipping/Dockerfile'

  pull_request:
    branches:
      - master
    paths:
      - '**.java'  # Only trigger PR Raise on  java files (*.java)
      - '.github/workflows/shipping.yaml'  # Include workflow file changes

jobs:
  shipping:
    name: Build and deploy shipping microservice
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory:  shipping
    steps:
      - name: Checkout code 
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t ${{secrets.DOCKERHUB_USERNAME}}/shipping:${{ github.run_number}} \
            -t ${{secrets.DOCKERHUB_USERNAME}}/shipping:latest .

      - name: Docker Login (use secrets)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Docker Push
        run: |
          docker push ${{secrets.DOCKERHUB_USERNAME}}/shipping:${{ github.run_number}}
          docker push ${{secrets.DOCKERHUB_USERNAME}}/shipping:latest