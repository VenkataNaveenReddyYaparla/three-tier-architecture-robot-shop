name: Dispatch

on:
  push:
    branches:
      - master
    paths:
      - '**.go'  # Only trigger on changes to Python files (**.py)
      - '.github/workflows/dispatch.yaml'  # Include workflow file changes

  pull_request:
    branches:
      - master
    paths:
      - '**.go'  # Only trigger on changes to Python files (**.py)
      - '.github/workflows/dispatch.yaml'  # Include workflow file changes

jobs:
  payment:
    name: Build and deploy dispatch microservice
    runs-on: ubuntu-latest  # Use a standard runner instead of self-hosted
    defaults:
      run:
        working-directory: dispatch

    steps:
      - name: Checkout code 
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build -t ${{secrets.DOCKERHUB_USERNAME}}/dispatch:${{ github.run_number }} .  # Build image tagged as 'payment' from current directory

      - name: Docker Login (use secrets)
        run: docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Push
        run: |
          docker push ${{secrets.DOCKERHUB_USERNAME}}/dispatch:${{ github.run_number }}