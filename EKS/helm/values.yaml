# Pull policy, applied to every workload in this chart.
image:
  pullPolicy: IfNotPresent

# EUM configuration
# Provide your key and set the endpoint
eum:
  key: null
  url: https://eum-eu-west-1.instana.io
  #url: https://eum-us-west-2.instana.io

# Pod Security Policy
psp:
  enabled: false

# For the mini ones minikube, minishift set to true
nodeport: false

# "special" Openshift. Set to true when deploying to any openshift flavour
openshift: false

ocCreateRoute: false

##########################################################################
# Per-workload image and scheduling.
#
# Each service carries its OWN image, because each GitHub Actions workflow
# tags with its own github.run_number -- there is no single version that
# applies across all of them, and no :latest is ever pushed.
#
# Affinities are set on the same key:
# <workload>:
#   image: <repo>/<name>:<tag>
#   affinity: {}
#   nodeSelector: {}
#   tolerations: []
##########################################################################

# ---- built by .github/workflows/*, pushed to your Docker Hub ----

cart:
  image: naveenreddy9/cart:15

catalogue:
  image: naveenreddy9/catalogue:11

dispatch:
  image: naveenreddy9/dispatch:7

payment:
  image: naveenreddy9/payment:1
  # Alternative payment gateway URL
  # Default is https://www.paypal.com
  gateway: null
  #gateway: https://www.worldpay.com

# note: the workflow pushes 'rating' (singular)
ratings:
  image: naveenreddy9/rating:1

shipping:
  image: naveenreddy9/shipping:6

web:
  image: naveenreddy9/web:1

# ---- upstream robotshop images ----
# mongodb and mysql bake in the seed data (mongo/catalogue.js,
# mysql/scripts) and no workflow builds them. Plain mongo/mysql
# images would start empty.
# user is here until .github/workflows/user.yaml pushes successfully.

mongodb:
  image: robotshop/rs-mongodb:2.1.0

mysql:
  image: robotshop/rs-mysql-db:2.1.0

user:
  image: robotshop/rs-user:2.1.0

# ---- images pinned directly in their templates ----

rabbitmq: {}

redis:
  # Storage class to use with redis statefulset.
  storageClassName: gp2
